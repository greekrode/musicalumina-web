name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch so an in-flight CI against an
# older commit doesn't block the newer push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Public-safe placeholders keep modules that initialize browser clients
    # importable during tests and builds. CI never connects to these values.
    env:
      VITE_SUPABASE_URL: "https://ci.supabase.invalid"
      VITE_SUPABASE_ANON_KEY: "ci-placeholder"
      VITE_CLERK_PUBLISHABLE_KEY: "pk_test_ci-placeholder"
      VITE_TINYMCE_API_KEY: "ci-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
